$kind: http-request
url: "{{baseUrl}}/alunos/{{alunoId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Aluno não encontrado");
      });
    language: text/javascript
order: 11000
