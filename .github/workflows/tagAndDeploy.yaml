name: Tag and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        required: true
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jcf-junior/trabalho_m2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.2

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version_tag }}-${{ matrix.arch }}

  tag:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          VERSION=${{ needs.version.outputs.version_tag }}
          SRC_AMD64=$IMAGE:$VERSION-amd64
          SRC_ARM64=$IMAGE:$VERSION-arm64

          docker buildx imagetools create -t $IMAGE:$VERSION $SRC_AMD64 $SRC_ARM64
          docker buildx imagetools create -t $IMAGE:${{ inputs.environment }} $SRC_AMD64 $SRC_ARM64

      - name: Inspect result
        run: docker buildx imagetools inspect $IMAGE:${{ inputs.environment }}

  deploy:
    needs: tag
    runs-on: [self-hosted, deploy, "vm-${{ inputs.environment }}"]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VM
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ inputs.environment }}
        run: |
          docker compose pull
          docker compose up -d
