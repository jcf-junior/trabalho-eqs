$kind: http-request
url: "{{baseUrl}}/alunos/{{alunoId}}/disciplinas/{{disciplinaSigla}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Inscrição não encontrada");
      });
    language: text/javascript
order: 4000
