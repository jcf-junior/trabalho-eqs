$kind: http-request
url: "{{baseUrl}}/disciplinas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sigla": "D{{runId}}",
      "nome": "Disciplina Teste",
      "professor_responsavel_id": {{professorId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      const disciplina = pm.response.json();

      pm.test("Response contains the created disciplina", function () {
          pm.expect(disciplina.sigla).to.eql("D" + pm.collectionVariables.get("runId"));
          pm.expect(disciplina.nome).to.eql("Disciplina Teste");
      });

      pm.collectionVariables.set("disciplinaSigla", disciplina.sigla);
    language: text/javascript
order: 1000
