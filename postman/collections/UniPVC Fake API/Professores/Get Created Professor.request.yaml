$kind: http-request
url: "{{baseUrl}}/professores/{{professorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Professor is saved in the database", function () {
          pm.expect(pm.response.json().nome).to.eql("Professor Teste");
      });
    language: text/javascript
order: 2000
