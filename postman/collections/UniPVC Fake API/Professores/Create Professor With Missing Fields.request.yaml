$kind: http-request
url: "{{baseUrl}}/professores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Professor Incompleto"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Campos obrigatórios: nome, habilitacoes, email");
      });
    language: text/javascript
order: 4000
