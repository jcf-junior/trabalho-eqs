name: Build Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jcf-junior/trabalho_m2

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.2

      - name: Garantir que a versão é nova
        env:
          VERSION: ${{ steps.semver.outputs.version_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "A versão ${VERSION} já existe. Faz um commit novo antes de voltar a compilar."
            exit 1
          fi
          echo "Nova versão: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version_tag }}-${{ matrix.arch }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        env:
          VERSION: ${{ needs.version.outputs.version_tag }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Create git tag
        env:
          VERSION: ${{ needs.version.outputs.version_tag }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
