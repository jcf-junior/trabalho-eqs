$kind: http-request
url: "{{baseUrl}}/alunos/{{alunoId}}/disciplinas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sigla": "NAOEXISTE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Referência inválida");
      });
    language: text/javascript
order: 7000
