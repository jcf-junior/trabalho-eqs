$kind: http-request
url: "{{baseUrl}}/alunos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Aluno Teste",
      "curso_id": {{cursoId}},
      "email": "aluno.{{runId}}@unipvc.pt"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Registo já existe");
      });
    language: text/javascript
order: 2000
