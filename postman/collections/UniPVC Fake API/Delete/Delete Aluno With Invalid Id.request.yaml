$kind: http-request
url: "{{baseUrl}}/alunos/abc"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Dados inválidos");
      });
    language: text/javascript
order: 12000
