$kind: http-request
url: "{{baseUrl}}/cursos/{{cursoId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Registo em uso por outros registos");
      });
    language: text/javascript
order: 2000
