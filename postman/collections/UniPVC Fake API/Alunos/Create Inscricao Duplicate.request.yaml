$kind: http-request
url: "{{baseUrl}}/alunos/{{alunoId}}/disciplinas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sigla": "{{disciplinaSigla}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("Error message is correct", function () {
          pm.expect(pm.response.json().error).to.eql("Registo já existe");
      });
    language: text/javascript
order: 6000
